[paths]
# Shared source directories (relative to script directory)
forensics_input = Inputs/Forensics Input
defenseflow_input = Inputs/DefenseFlow Input

# Final output directory for all reports
# C:\DATA\Scripts\Monthly_activity_report\Reports
output_dir = Reports

[processing]
# Default processing parameters
gap_min = 5
split_by_port = false
skip_bad_lines = false
time_format = %m/%d/%Y %H:%M:%S
encoding = utf-8

# Automatically filter out invalid destination IPs
# Removes rows where Destination IP is: 0.0.0.0, Multiple
filter_invalid_ips = true

[units]
# Display units for bandwidth and packet rates
bps_unit = auto
pps_unit = auto

[time_filter]
# Time range filter for attack data (optional)
# Leave blank or comment out to process all data
# 
# Active filter: August 2026
start = 2026-08-01
end = 2026-08-31 23:59:59
#
# Option 2: Relative time filters (comment out fixed range above to use these)
# last_hours = 24        # Last 24 hours
# last_days = 7          # Last 7 days
#
# Format: YYYY-MM-DD HH:MM:SS or YYYY-MM-DD
# Examples:
#   start = 2026-07-01
#   end = 2026-07-24 18:00:00
#   last_days = 30

[report]
# Default report title template
title_template = Radware Attack Report - {period}

# ══════════════════════════════════════════════════════════════════
#  External Detector Settings
# ══════════════════════════════════════════════════════════════════

[detector:kentik]
name = Kentik
# Uses the shared Forensics and DefenseFlow input folders.
# Optional activation substring from alert logs. Leave blank to use attack cycles.
activation_str =

[detector:arbor]
name = Arbor
# Uses the shared Forensics and DefenseFlow input folders.
# Optional activation substring from alert logs. Leave blank to use attack cycles.
activation_str =

[detector:defensepro]
name = DefensePro
# Uses DEFENSE_PRO events from the shared DefenseFlow input folders.
# Optional deployment-specific activation substring.
# Leave blank to use the default attack-cycle activation logic.
activation_str =
